[package]
name = "claude-3p-cost"
version = "0.1.0"
edition = "2021"
license = "EUPL-1.2"
authors = ["Sebastian Rettig <serettig@posteo.de>"]

[lib]
name = "claude_3p_cost_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
